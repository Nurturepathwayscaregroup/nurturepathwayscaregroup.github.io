<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact Nurture Pathways Care Group</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<section class="contact-section">

<div class="contact-container">

<div class="contact-intro">
<span>GET IN TOUCH</span>

<h1>How can we support you?</h1>

<p>
If you would like to learn more about our care and support
services, please complete the form and a member of our team
will get back to you.
</p>

<div class="contact-details">
<p>
<strong>Email</strong><br>
<a href="mailto:admin@nurturepathwaysgroup.co.uk">
admin@nurturepathwaysgroup.co.uk
</a>
</p>

<p>
<strong>Phone</strong><br>
<a href="tel:+447498298012">
+44 7498 298012
</a>
</p>

<p>
<strong>Address</strong><br>
22 Millbrook Avenue,<br>
Middlesbrough, TS3 9EB
</p>
</div>
</div>


<!-- FORM SUBMIT FORM -->

<form
action="https://formsubmit.co/admin@nurturepathwaysgroup.co.uk"
method="POST"
class="contact-form"
>

<!-- Email subject -->
<input
type="hidden"
name="_subject"
value="New enquiry from Nurture Pathways website"
>

<!-- FormSubmit settings -->
<input
type="hidden"
name="_template"
value="table"
>

<input
type="hidden"
name="_captcha"
value="false"
>

<!-- Redirect after submission -->
<input
type="hidden"
name="_next"
value="https://nurturepathwayscaregroup.github.io/thank-you.html"
>


<div class="form-group">
<label for="name">Full Name *</label>

<input
type="text"
id="name"
name="name"
placeholder="Your full name"
required
>
</div>


<div class="form-group">
<label for="email">Email Address *</label>

<input
type="email"
id="email"
name="email"
placeholder="your@email.com"
required
>
</div>


<div class="form-group">
<label for="phone">Phone Number</label>

<input
type="tel"
id="phone"
name="phone"
placeholder="+44..."
>
</div>


<div class="form-group">
<label for="service">Service You're Interested In</label>

<select id="service" name="service">

<option value="">
Please select
</option>

<option value="Personal Care">
Personal Care
</option>

<option value="Supported Living">
Supported Living
</option>

<option value="Companionship">
Companionship
</option>

<option value="Community Support">
Community Support
</option>

<option value="Respite Support">
Respite Support
</option>

<option value="Individual Support">
Individual Support
</option>

<option value="General Enquiry">
General Enquiry
</option>

</select>
</div>


<div class="form-group">
<label for="message">Message *</label>

<textarea
id="message"
name="message"
placeholder="Tell us how we can help..."
required
></textarea>
</div>


<button type="submit">
Send Enquiry
</button>

</form>

</div>

</section>

</body>
</html>
